<svg width="280" height="280" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1db954;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1ed760;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#191414;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#282828;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="280" height="280" fill="url(#grad2)"/>
  
  <!-- Decorative circles -->
  <circle cx="70" cy="70" r="50" fill="url(#grad1)" opacity="0.3"/>
  <circle cx="210" cy="210" r="60" fill="url(#grad1)" opacity="0.2"/>
  <circle cx="140" cy="140" r="80" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Music note symbol -->
  <g transform="translate(140, 140)">
    <!-- Note stems -->
    <rect x="-8" y="-60" width="3" height="90" fill="#1db954" rx="2"/>
    <rect x="8" y="-50" width="3" height="80" fill="#1db954" rx="2"/>
    
    <!-- Note heads -->
    <circle cx="-8" cy="30" r="10" fill="#1db954"/>
    <circle cx="8" cy="30" r="10" fill="#1db954"/>
    
    <!-- Connecting line -->
    <path d="M -5 -60 Q 0 -55 5 -50" stroke="#1db954" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Border -->
  <rect width="280" height="280" fill="none" stroke="#1db954" stroke-width="2" opacity="0.5"/>
</svg>
